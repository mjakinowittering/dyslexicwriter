  <style>
    /* src/routes/layout.css :root — verbatim */
    :root{
      --background:oklch(0.98 0 0);--foreground:oklch(0.145 0 0);
      --card:oklch(0.99 0 0);--popover:oklch(0.99 0 0);
      --primary:oklch(0.205 0 0);--primary-foreground:oklch(0.985 0 0);
      --secondary:oklch(0.95 0 0);--muted:oklch(0.95 0 0);
      --muted-foreground:oklch(0.53 0 0);--accent:oklch(0.92 0 0);
      --destructive:oklch(0.53 0.225 27.325);
      --border:oklch(0.9 0 0);--input:oklch(0.9 0 0);--ring:oklch(0.708 0 0);
      --canvas:oklch(0.955 0 0);--sheet:oklch(0.99 0 0);
      --sheet-shadow:0 1px 2px oklch(0.145 0 0 / 0.05),0 8px 24px oklch(0.145 0 0 / 0.06);
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--background);color:var(--foreground);font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
    a{color:var(--foreground);text-decoration:underline;text-underline-offset:4px}
    a:hover{color:var(--muted-foreground)}
    svg{display:block;fill:none}
    /* shadcn-svelte toggle-group, spacing=0, variant=outline — joined segments */
    .tg{display:flex;align-items:center;border-radius:10px}
    .tgi{height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--input);border-left-width:0;background:transparent;color:var(--foreground);font-size:14px;font-weight:500}
    .tg .tgi:first-child{border-left-width:1px;border-top-left-radius:10px;border-bottom-left-radius:10px}
    .tg .tgi:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
    .tgi[data-on]{background:var(--muted)}
    .tgi[data-off]{opacity:.5}
    /* shadcn-svelte button */
    .btn{height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:500;background:transparent;color:var(--foreground);white-space:nowrap}
    .btn-icon{width:32px;height:32px;padding:0}
    .btn-primary{background:var(--primary);color:var(--primary-foreground)}
    .btn-outline{border-color:var(--border);background:var(--background)}
    .btn-muted{background:var(--muted)}
    /* shadcn-svelte button-group — joined, the split button on the Files screen */
    .bg-grp{display:flex;width:fit-content;align-items:stretch}
    .bg-grp > .btn{border-radius:0}
    .bg-grp > .btn:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
    .bg-grp > .btn:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
    .bg-grp > .btn + .btn{border-left:1px solid color-mix(in oklch,var(--primary-foreground) 20%,transparent)}
    /* dropdown-menu content + item */
    .menu{position:absolute;z-index:50;display:flex;min-width:180px;flex-direction:column;border-radius:10px;padding:4px;background:var(--popover);box-shadow:0 0 0 1px color-mix(in oklch,var(--border) 100%,transparent),0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1)}
    .menu-item{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 8px;font-size:14px;white-space:nowrap}
    .menu-item[data-active]{background:var(--accent)}
    .menu-item[data-disabled]{opacity:.5}
    /* Files tree — FileTree.svelte / FileTreeDocument.svelte.
       Row icons are 24px: the rows are bare <button>s, so shadcn's
       [&_svg:not([class*='size-'])]:size-4 never reaches them. */
    .row{display:flex;align-items:center;gap:8px;border-radius:8px;box-shadow:0 0 0 1px transparent}
    .row[data-hover]{background:color-mix(in oklch,var(--muted) 40%,transparent);box-shadow:0 0 0 1px var(--border)}
    .row-btn{display:flex;flex:1;min-width:0;align-items:center;gap:8px;border:0;border-radius:0;background:transparent;color:inherit;padding:8px;text-align:left;font:inherit;cursor:pointer}
    /* size="icon-lg" (36px) holding a 24px glyph, so it matches the row icons
       rather than the 16px the Button base would otherwise force. */
    .row-menu{width:36px;height:36px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:inherit;opacity:0}
    .row[data-hover] .row-menu{opacity:1}
    /* One icon column of indent: 20px puts the guide down the centre of the
       parent's chevron (8–32), then 1px border + 11px = 32px in all. A child
       row's own 8px padding then starts its first icon at 40 — exactly where
       the parent's FOLDER icon starts. */
    .kids{margin-left:20px;border-left:1px solid var(--border);padding-left:11px}
    ul.tree{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
    .muted{color:var(--muted-foreground)}
    .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* Tailwind Typography — the app sets no custom prose colours, so these are its defaults */
    .prose{font-size:18px;line-height:1.7778;color:#374151}
    .prose h1{font-size:30px;font-weight:600;line-height:1.2;color:#111827;margin:0 0 24px}
    .prose h2{font-size:24px;font-weight:600;line-height:1.3;color:#111827;margin:32px 0 16px}
    .prose h3{font-size:20px;font-weight:600;line-height:1.4;color:#111827;margin:28px 0 12px}
    .prose p{margin:0 0 24px}
    .prose strong{color:#111827;font-weight:600}
    .prose ul{margin:0 0 24px;padding-left:26px}
    .prose li{margin:4px 0}
    .prose blockquote{margin:24px 0;padding-left:20px;border-left:4px solid #e5e7eb;font-style:italic;color:#111827}
    /* Read-aloud decorations — tiptap-tts-highlight.ts */
    .tts-sentence{background-color:rgb(250 204 21 / 0.18);border-radius:0.15rem}
    .tts-word{background-color:rgb(250 204 21 / 0.45);border-radius:0.15rem;box-shadow:0 0 0 1px rgb(202 138 4 / 0.35)}
    /* The reading font — OpenDyslexic, self-hosted in the app; the canvas falls back */
    .reading-font{font-family:'OpenDyslexic','Comic Sans MS',sans-serif;letter-spacing:-0.01em}
    .reading-font .tts-sentence,.reading-font .tts-word{background-color:transparent;background-image:linear-gradient(rgb(250 204 21 / 0.18),rgb(250 204 21 / 0.18));background-position:0 0.35em;background-repeat:no-repeat;background-size:100% 1.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:none}
  </style>
