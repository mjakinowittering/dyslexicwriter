<!doctype html>

<html lang="en" dir="ltr" class="h-full">
    <head>
        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta name="text-scale" content="scale" />

        <!--
            Site-level metadata, deliberately static. The public surface is one
            screen — the welcome page; `/edit` only ever shows the user's own
            local documents, so there is nothing per-document to describe. With
            `ssr = false` these tags are the only thing a non-JS crawler reads,
            and they sit outside the Svelte tree, so they stay literal rather
            than going through Paraglide. `og:image` needs a stable absolute
            URL, which is why every URL here is spelled out in full.
        -->
        <meta
            name="description"
            content="DyslexicWriter is a distraction-free markdown word processor that reads your writing aloud. Your documents stay as real files in a folder on your own machine — no account, no server, no sync."
        />
        <meta property="og:title" content="DyslexicWriter" />
        <meta
            property="og:description"
            content="DyslexicWriter is a distraction-free markdown word processor that reads your writing aloud. Your documents stay as real files in a folder on your own machine — no account, no server, no sync."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:url"
            content="https://mjakinowittering.github.io/dyslexicwriter/"
        />
        <meta
            property="og:image"
            content="https://mjakinowittering.github.io/dyslexicwriter/og-image.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="DyslexicWriter — write, and hear it back."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="DyslexicWriter" />
        <meta
            name="twitter:description"
            content="DyslexicWriter is a distraction-free markdown word processor that reads your writing aloud. Your documents stay as real files in a folder on your own machine — no account, no server, no sync."
        />
        <meta
            name="twitter:image"
            content="https://mjakinowittering.github.io/dyslexicwriter/og-image.png"
        />

        <!--
            The dark `--background` from src/routes/layout.css, matching the app's
            default mode. One tag, and no `media` query: the mode is a preference
            in the user's config.json rather than the OS's, so mode-watcher
            rewrites this `content` to match whichever theme is actually showing
            (see the `themeColors` prop in src/routes/+layout.svelte).
        -->
        <meta name="theme-color" content="#0a0a0a" />

        <link
            rel="canonical"
            href="https://mjakinowittering.github.io/dyslexicwriter/"
        />

        <title>DyslexicWriter</title>
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" class="h-full">
        <div class="h-full">%sveltekit.body%</div>

        <!--
            The served body is empty until JavaScript runs. Crawlers and fetchers
            that don't execute it read the head alone, so give them a sentence of
            real prose rather than reinstating SSR for a page that has no server.
        -->
        <noscript>
            <p>
                DyslexicWriter is a distraction-free markdown word processor
                with read-aloud, built for a dyslexic writer. It runs entirely
                in your browser against a folder of files on your own machine.
                It needs JavaScript, and a browser that supports the File System
                Access API.
            </p>
        </noscript>
    </body>
</html>
